name: Generate Changelog (AI)

# Jalan otomatis tiap ada push ke main -- MENDAHULUI notifikasi push
# "update tersedia" (lihat notify-update.yml), supaya sebisa mungkin entri
# changelog baru sudah ikut ter-deploy sebelum/bersamaan dengan notifikasi
# itu dikirim.
#
# GUARD PENTING supaya tidak infinite loop: workflow ini men-commit balik
# ke `main` (lihat step terakhir). Commit balik itu SENDIRI juga men-trigger
# event "push ke main" lagi. Makanya job ini dilewati kalau commit yang
# memicunya mengandung penanda "chore(changelog)" (ciri commit bot dari
# workflow ini sendiri) atau "[skip-notify]" (penanda commit yang memang
# sengaja tidak mau diberitahukan ke user, dipakai bersama notify-update.yml).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore(changelog)') && !contains(github.event.head_commit.message, '[skip-notify]') }}
    steps:
      - name: Checkout (riwayat & tag lengkap)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # perlu riwayat penuh supaya `git log <tag>..HEAD` bisa jalan
          fetch-tags: true
          # Token khusus (bukan GITHUB_TOKEN bawaan) supaya commit balik di
          # bawah bisa men-trigger workflow lain (notify-update.yml) dengan
          # normal. GITHUB_TOKEN bawaan sengaja TIDAK memicu workflow lain
          # oleh GitHub (demi mencegah rekursi tak sengaja) -- jadi kalau
          # ingin notify-update.yml tetap jalan seperti biasa untuk push
          # commit lain (bukan dari bot ini), pola umum yang dipakai adalah
          # personal access token terpisah bernama `CHANGELOG_BOT_TOKEN`.
          # Kalau secret ini tidak di-set, langkah checkout tetap jalan
          # pakai GITHUB_TOKEN bawaan (fallback) -- hanya saja commit balik
          # dari bot tidak akan ikut men-trigger workflow lain.
          token: ${{ secrets.CHANGELOG_BOT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate entri changelog dari commit git (via Gemini)
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-changelog.mjs

      - name: Commit & push perubahan changelog
        if: steps.generate.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/changelog.json
          # "[skip-notify]" sengaja disertakan supaya notify-update.yml TIDAK
          # mengirim push notification KEDUA untuk commit bot ini -- push
          # notification "update tersedia" cukup dikirim SEKALI untuk commit
          # asli developer. Isi popup update tetap segar karena
          # `UpdatePrompt.tsx` mem-fetch `public/changelog.json` langsung
          # lewat network saat dialog akan tampil (bukan baca dari bundle JS
          # versi lama yang sedang berjalan di browser user) -- lihat
          # penjelasan lengkap di komentar `src/data/changelog.ts`.
          git commit -m "chore(changelog): rangkum pembaruan otomatis via AI [skip-notify]"

          # Pindahkan tag penanda sinkronisasi ke commit changelog yang baru
          # ini, supaya run berikutnya tahu dari mana harus mulai membaca
          # commit baru lagi.
          git tag -f changelog-sync
          git push origin main
          git push origin changelog-sync --force
