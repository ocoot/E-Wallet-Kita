name: Generate Changelog (AI)

# Jalan otomatis tiap ada push ke main -- MENDAHULUI notifikasi push
# "update tersedia" (lihat notify-update.yml), supaya sebisa mungkin entri
# changelog baru sudah tersimpan di Supabase sebelum/bersamaan dengan
# notifikasi itu dikirim.
#
# PERUBAHAN (2026-08-15): workflow ini TIDAK LAGI commit balik ke `main`.
# Sebelumnya `scripts/generate-changelog.mjs` menulis ke
# `public/changelog.json` lalu step terakhir di sini meng-commit &
# push file itu -- yang perlu guard anti-infinite-loop ("chore(changelog)"
# / "[skip-notify]") karena commit balik itu sendiri men-trigger event
# push lagi. Sekarang script menulis LANGSUNG ke tabel `changelog_entries`
# di Supabase (lihat migration 20260815000000_changelog_entries.sql),
# jadi TIDAK ADA lagi commit balik, TIDAK ADA lagi risiko infinite loop,
# dan guard tersebut sudah tidak relevan lagi -- dihapus.
#
# Alasan pemindahan dari file ke Supabase: `public/changelog.json` yang
# di-commit bot ini ternyata selalu tertimpa balik ke versi lama setiap
# kali source di-sync dari Google AI Studio ke GitHub, karena AI Studio's
# sync tidak mengenali file yang lahir dari commit pihak lain (bot ini)
# dan tidak ada mekanisme ignore resmi untuk sync tersebut.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # tetap dibutuhkan: script memindah git tag `changelog-sync` (push tag, bukan push commit ke main)

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (riwayat & tag lengkap)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # perlu riwayat penuh supaya `git log <tag>..HEAD` bisa jalan
          fetch-tags: true
          # GITHUB_TOKEN bawaan sudah cukup di sini -- tidak ada lagi commit
          # balik ke main yang perlu men-trigger workflow lain lewat push;
          # notify-update.yml di-trigger lewat `workflow_run` (menunggu
          # workflow INI selesai), bukan lewat event push, jadi token
          # khusus (CHANGELOG_BOT_TOKEN) untuk itu sudah tidak diperlukan.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # WAJIB >=22: @supabase/supabase-js membuat Realtime
                                # client secara eager di dalam createClient(), dan itu
                                # throw synchronous kalau Node <22 tanpa native
                                # WebSocket (lihat error "Node.js 20 detected without
                                # native WebSocket support" -- ini bukan terkait
                                # Realtime dipakai atau tidak, script ini sama sekali
                                # tidak pakai fitur Realtime, tapi constructor-nya tetap
                                # jalan lebih dulu sebelum sempat query/insert apapun).
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate & simpan entri changelog dari commit git (via Gemini) ke Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/generate-changelog.mjs
