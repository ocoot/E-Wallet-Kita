name: Database Backup (Supabase -> Google Drive)

# Pengganti "cron + backup.sh" di server tradisional. Karena stack ini
# Vercel (serverless, ada time-limit) + Supabase free tier (tanpa VPS),
# proses backup dijalankan di runner GitHub Actions yang gratis dan tidak
# kena batas durasi 60 detik seperti Vercel Function.
#
# Alur (mirror dari workflow mysqldump -> gzip -> rclone di gambar):
#   1. pg_dump  -> dump database Supabase, format CUSTOM (-Fc), pengganti mysqldump
#   2. (format custom sudah terkompresi bawaan -- tidak perlu gzip terpisah)
#   3. rclone   -> upload ke Google Drive (off-site, di luar Supabase)
#   4. log hasil ke tabel public.backup_logs (Supabase)
#   5. notifikasi Telegram sukses/gagal
#
# KENAPA format custom (-Fc), bukan plain+gzip seperti sebelumnya:
#   Format custom adalah satu-satunya format pg_dump yang mendukung restore
#   PARSIAL per tabel (`pg_restore -t nama_tabel`) dari FILE YANG SAMA,
#   tanpa perlu bikin dump terpisah per tabel. Ini yang memungkinkan fitur
#   "restore 1 tabel saja" di db-restore.yml tanpa menimpa data seluruh
#   pengguna di tabel lain. Format ini juga sudah terkompresi secara
#   internal, jadi step gzip manual dihapus.
#
# Trigger:
#   - schedule terjadwal tiap malam (jam 02:00 WIB)
#   - workflow_dispatch: bisa dipicu manual dari tab Actions, ATAU dari
#     tombol "Backup Sekarang" di Admin Panel lewat GitHub REST API
#     (lihat api/admin/backup.ts)
#
# Secrets yang WAJIB diset di Settings -> Secrets and variables -> Actions:
#   SUPABASE_DB_URL            postgres://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres
#                               (Project Settings -> Database -> Connection string ->
#                                pilih "Session mode", BUKAN "Transaction mode" dan BUKAN
#                                direct connection "db.[project-ref].supabase.co").
#
#                               KENAPA bukan direct connection: direct connection Supabase
#                               cuma resolve ke alamat IPv6, sedangkan runner GitHub Actions
#                               (ubuntu-latest) IPv4-only -> gagal dengan error
#                               "Network is unreachable". Kecuali IPv4 add-on Supabase
#                               diaktifkan di project ini, JANGAN pakai direct connection.
#
#                               KENAPA bukan Transaction mode (port 6543): transaction mode
#                               bisa memindahkan koneksi client ke backend Postgres fisik
#                               yang berbeda di setiap transaksi baru, sehingga GUC session
#                               (mis. `session_replication_role`) yang di-set di satu
#                               transaksi bisa hilang di transaksi berikutnya -- ini pernah
#                               menyebabkan restore table-scope gagal dengan FK violation
#                               padahal trigger FK harusnya sudah dimatikan (lihat komentar
#                               di db-restore.yml step "Jalankan restore").
#
#                               Session mode (port 5432 lewat pooler) memberi 1 backend
#                               tetap per koneksi sepanjang sesi (sama seperti direct
#                               connection dari sisi konsistensi state), TAPI tetap
#                               IPv4-compatible karena lewat Supavisor -- jadi aman dipakai
#                               dari GitHub Actions maupun untuk pg_restore multi-transaksi.
#   SUPABASE_URL                sudah ada (dipakai workflow lain)
#   SUPABASE_SERVICE_ROLE_KEY   sudah ada (dipakai workflow lain)
#   RCLONE_CONFIG_GDRIVE_TOKEN  hasil `rclone authorize "drive"` (JSON token), lihat catatan di bawah
#   RCLONE_CONFIG_GDRIVE_CLIENT_ID       (opsional, kalau pakai OAuth app sendiri)
#   RCLONE_CONFIG_GDRIVE_CLIENT_SECRET   (opsional, pasangan client id di atas)
#   TELEGRAM_BOT_TOKEN           sudah ada (dipakai bot Telegram existing)
#   TELEGRAM_ADMIN_CHAT_ID      chat_id kamu/grup admin untuk notifikasi backup
#
# Cara dapat RCLONE_CONFIG_GDRIVE_TOKEN (dilakukan SEKALI, di laptop sendiri):
#   1. Install rclone: https://rclone.org/downloads/
#   2. Jalankan: rclone config
#      -> New remote -> nama "gdrive" -> pilih "drive" (Google Drive)
#      -> ikuti proses login OAuth di browser
#   3. Setelah selesai, jalankan: rclone config show gdrive
#      -> salin nilai "token = {...}" (satu baris JSON) ke secret di atas

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 02:00 WIB
  workflow_dispatch:
    inputs:
      triggered_by_admin:
        description: "UUID admin yang memicu manual (diisi otomatis oleh Admin Panel)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_SECRET }}
      GDRIVE_FOLDER: "ewallet-kita-backups"
      TRIGGERED_BY: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'cron' }}
      TRIGGERED_BY_ADMIN: ${{ github.event.inputs.triggered_by_admin }}

    steps:
      - name: Catat status "running" ke Supabase
        id: log_start
        run: |
          RESP=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/backup_logs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"status\":\"running\",\"triggered_by\":\"$TRIGGERED_BY\",\"triggered_by_admin\": $( [ -n "$TRIGGERED_BY_ADMIN" ] && echo "\"$TRIGGERED_BY_ADMIN\"" || echo null )}")
          echo "log_id=$(echo "$RESP" | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"

      - name: Install postgresql-client 17 (PGDG repo) & rclone
        run: |
          set -euo pipefail
          # Ubuntu 24.04 default repo cuma punya postgresql-client-16, sedangkan
          # project Supabase jalan di Postgres 17 -- pg_dump versi client HARUS
          # >= versi server, jadi kita tambah repo resmi PostgreSQL (PGDG) dulu
          # supaya bisa install postgresql-client-17 (bukan yang bawaan Ubuntu).
          #
          # PENTING: versi package DIPIN ke angka yang SAMA PERSIS dengan
          # PG_CLIENT_VERSION di db-restore.yml. Kalau tidak dipin, PGDG bisa
          # merilis versi minor baru kapan saja sehingga pg_dump (di sini) dan
          # pg_restore (di db-restore.yml) berjalan di runner yang beda waktu
          # dengan versi client yang berbeda -- berisiko file dump dari versi
          # lebih baru tidak bisa dibaca oleh pg_restore versi lebih lama.
          # Kalau sengaja mau upgrade, ubah versi ini BERSAMAAN dengan
          # db-restore.yml.
          PG_CLIENT_VERSION="17.10-1.pgdg24.04+1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-17=${PG_CLIENT_VERSION}"
          curl -s https://rclone.org/install.sh | sudo bash

      - name: Dump database (pg_dump --format=custom)
        id: dump
        run: |
          set -euo pipefail
          # PENTING: JANGAN panggil `pg_dump` polos di sini. Image runner
          # GitHub (ubuntu-latest) sudah punya postgresql-client-16
          # BAWAAN di /usr/bin/pg_dump, dan meski postgresql-client-17
          # baru saja diinstall di step sebelumnya, PATH/update-alternatives
          # masih bisa resolve ke binary v16 yang lebih lama itu -- lihat
          # error "server version: 17.6; pg_dump version: 16.14".
          # Solusinya: panggil binary v17 lewat PATH LENGKAPNYA supaya tidak
          # ambigu, tidak peduli binary mana yang menang di /usr/bin.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          if [ ! -x "$PG_DUMP" ]; then
            echo "::error::pg_dump v17 tidak ditemukan di $PG_DUMP -- cek step instalasi PGDG"
            exit 1
          fi
          "$PG_DUMP" --version

          TS=$(date -u +"%Y%m%d-%H%M%S")
          FILE_NAME="ewallet-kita-${TS}.dump"
          # --format=custom (-Fc): terkompresi otomatis + mendukung restore
          # parsial per tabel lewat `pg_restore -t` (lihat db-restore.yml).
          #
          # --schema=public: WAJIB. Tanpa ini, pg_dump ikut men-dump SEMUA
          # schema internal yang dikelola Supabase (auth, storage,
          # extensions, realtime, cron, net, graphql, vault, dst) beserta
          # event trigger, RLS toggle, dan publication milik schema
          # tersebut. Schema-schema itu dimiliki role internal Supabase
          # (supabase_admin, supabase_auth_admin, supabase_storage_admin,
          # dst) -- role "postgres" yang dipakai di sini BUKAN pemiliknya
          # dan bukan superuser sungguhan, jadi saat FULL RESTORE mencoba
          # DROP/CREATE/ALTER objek-objek itu, muncul banjir error
          # "must be owner of table/event trigger ..." (ratusan error,
          # exit code 1) meski data tabel public tetap berhasil ter-restore
          # karena pg_restore melanjutkan proses dan cuma meng-ignore error
          # per statement, bukan berhenti total.
          #
          # Schema internal Supabase TIDAK PERLU di-backup lewat jalur ini:
          # strukturnya sudah dikelola & direplikasi oleh platform Supabase
          # sendiri (migration lewat supabase/migrations, termasuk
          # cron.schedule(...) di dalamnya), bukan bagian dari "data
          # aplikasi" yang perlu disaster-recovery manual. Backup/restore
          # di workflow ini cukup fokus ke schema public (data aplikasi:
          # transactions, budgets, bill_reminders, dst).
          #
          # Kalau di masa depan project ini menambah custom schema selain
          # public, tambahkan flag --schema=<nama> lagi di sini (bisa
          # diulang, pg_dump mendukung multiple --schema).
          "$PG_DUMP" "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges --format=custom --compress=9 \
            --schema=public \
            --file="$FILE_NAME"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "file_size=$(stat -c%s "$FILE_NAME")" >> "$GITHUB_OUTPUT"

      - name: Upload ke Google Drive (rclone)
        run: |
          rclone copy "${{ steps.dump.outputs.file_name }}" "gdrive:${GDRIVE_FOLDER}" --progress

      - name: Catat status sukses
        if: success()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/backup_logs?id=eq.${{ steps.log_start.outputs.log_id }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"success\",\"file_name\":\"${{ steps.dump.outputs.file_name }}\",\"file_size_bytes\":${{ steps.dump.outputs.file_size }},\"storage_path\":\"${GDRIVE_FOLDER}/${{ steps.dump.outputs.file_name }}\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            -d text="✅ Backup database sukses%0AFile: ${{ steps.dump.outputs.file_name }}%0AUkuran: $(( ${{ steps.dump.outputs.file_size }} / 1024 )) KB"

      - name: Catat status gagal
        if: failure()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/backup_logs?id=eq.${{ steps.log_start.outputs.log_id }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"error_message\":\"Lihat log GitHub Actions run ${{ github.run_id }}\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            -d text="❌ Backup database GAGAL. Cek GitHub Actions run ${{ github.run_id }}."
