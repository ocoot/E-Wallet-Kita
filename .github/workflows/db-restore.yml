name: Database Restore (Google Drive -> Supabase)

# Dipicu HANYA lewat tombol "Restore" di Admin Panel > Backup, lewat
# api/admin/backup.ts (action: "restore") -- lihat file itu untuk validasi
# admin/owner, pengecekan backup berstatus 'success', dan penguncian
# maintenance mode SEBELUM workflow ini dipicu.
#
# Dua mode restore (KEDUANYA data-only, TIDAK PERNAH menyentuh
# schema/fungsi/extension -- lihat step "Jalankan restore" untuk alasannya,
# insiden 14/7/2026):
#   scope=full  -> Semua tabel YANG ADA DI DALAM FILE DUMP (dideteksi
#                  otomatis lewat `pg_restore --list`) ditimpa datanya.
#                  Untuk disaster recovery.
#   scope=table -> Hanya tabel yang dipilih admin yang ditimpa datanya.
#                  Tabel lain tidak tersentuh. Daftar tabel yang boleh
#                  dipilih dibatasi ke public.backup_restorable_tables
#                  (lihat migration 20260817000000_backup_restore_delete.sql).
#
# PENTING (table-scope): DELETE dijalankan dengan
# `session_replication_role = replica` supaya foreign-key trigger tidak
# ikut menghapus/mengubah baris di tabel LAIN yang mereferensikan tabel
# ini (mencegah efek cascade yang tidak diinginkan), BUKAN pakai
# `TRUNCATE ... CASCADE` yang bisa melebar ke tabel lain.
#
# Secrets: sama dengan db-backup.yml (SUPABASE_DB_URL, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, RCLONE_CONFIG_GDRIVE_*, TELEGRAM_*).

on:
  workflow_dispatch:
    inputs:
      restore_log_id:
        description: "ID baris backup_restore_logs (dibuat oleh api/admin/backup.ts sebelum dispatch)"
        required: true
      storage_path:
        description: "Path file di Google Drive, contoh: ewallet-kita-backups/ewallet-kita-20260817-020000.dump"
        required: true
      scope:
        description: "full atau table"
        required: true
      table_names:
        description: "Nama tabel dipisah koma, hanya dipakai jika scope=table"
        required: false
        default: ""
      triggered_by_admin:
        description: "UUID admin yang memicu restore (untuk atribusi backup pengaman otomatis)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_SECRET }}
      RESTORE_LOG_ID: ${{ github.event.inputs.restore_log_id }}
      STORAGE_PATH: ${{ github.event.inputs.storage_path }}
      SCOPE: ${{ github.event.inputs.scope }}
      TABLE_NAMES: ${{ github.event.inputs.table_names }}
      TRIGGERED_BY_ADMIN: ${{ github.event.inputs.triggered_by_admin }}

    steps:
      - name: Validasi input scope
        run: |
          if [ "$SCOPE" != "full" ] && [ "$SCOPE" != "table" ]; then
            echo "::error::scope harus 'full' atau 'table', dapat: $SCOPE"
            exit 1
          fi
          if [ "$SCOPE" = "table" ] && [ -z "$TABLE_NAMES" ]; then
            echo "::error::scope=table tapi table_names kosong"
            exit 1
          fi

      - name: Install postgresql-client 17 (PGDG repo) & rclone
        run: |
          set -euo pipefail
          # PENTING: versi package DIPIN (bukan hanya "postgresql-client-17"
          # tanpa versi) supaya pg_restore yang dipakai untuk restore selalu
          # >= versi pg_dump yang dipakai untuk backup (lihat db-backup.yml).
          # Kalau PGDG merilis versi minor baru dan kita tidak pin, restore
          # bisa jalan dengan pg_restore versi lebih lama dari pg_dump yang
          # membuat file dump-nya -> berisiko "unsupported version in file
          # header". Update PG_CLIENT_VERSION ini bersamaan dengan db-backup.yml
          # setiap kali sengaja upgrade versi client.
          PG_CLIENT_VERSION="17.10-1.pgdg24.04+1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg jq
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-17=${PG_CLIENT_VERSION}"
          curl -s https://rclone.org/install.sh | sudo bash

      - name: Auto-backup pengaman sebelum restore
        id: prebackup
        run: |
          set -euo pipefail
          # ═══════════════════════════════════════════════════════════════
          # LAPISAN PENGAMAN TAMBAHAN (saran pasca insiden 15/7/2026):
          # SEBELUM restore menyentuh satu baris pun, ambil snapshot segar
          # dari kondisi database SAAT INI dan upload ke Google Drive dulu.
          # Kalau restore ternyata masih bermasalah (bug lain yang belum
          # ketahuan, dump yang dipilih admin ternyata korup, dsb), admin
          # punya titik pemulihan yang PASTI mencerminkan kondisi tepat
          # sebelum restore ini dijalankan -- tidak perlu berharap file
          # backup lain kebetulan masih relevan.
          #
          # Step ini SENGAJA tidak pakai `continue-on-error` -- kalau backup
          # pengaman ini gagal (kredensial rclone bermasalah, koneksi DB
          # gagal, dll), SELURUH restore dibatalkan (job berhenti di sini).
          # Lebih baik restore tertunda daripada jalan tanpa jaring pengaman
          # setelah insiden kehilangan data kemarin.
          #
          # pg_dump di sini pakai flag PERSIS SAMA dengan db-backup.yml
          # (--schema=public + --exclude-table tabel operasional) supaya
          # konsisten dan tidak ikut membekukan status backup_logs miliknya
          # sendiri (lihat db-backup.yml untuk penjelasan lengkap kenapa
          # exclude ini wajib).
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          TS=$(date -u +"%Y%m%d-%H%M%S")
          FILE_NAME="ewallet-kita-prerestore-${TS}.dump"

          "$PG_DUMP" "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges --format=custom --compress=9 \
            --schema=public \
            --exclude-table=public.backup_logs \
            --exclude-table=public.backup_restore_logs \
            --exclude-table=public.backup_restorable_tables \
            --exclude-table=public.admin_audit_logs \
            --exclude-table=public.error_logs \
            --exclude-table=public.maintenance_settings \
            --exclude-table=public.maintenance_feature_locks \
            --exclude-table=public.telegram_processed_updates \
            --exclude-table=public.telegram_link_attempts \
            --exclude-table=public.api_rate_limits \
            --file="$FILE_NAME"

          FILE_SIZE=$(stat -c%s "$FILE_NAME")
          STORAGE_PATH="ewallet-kita-backups/${FILE_NAME}"

          echo "::notice::Mengunggah backup pengaman ke Google Drive: ${STORAGE_PATH}"
          rclone copy "$FILE_NAME" "gdrive:ewallet-kita-backups/" --progress

          # Catat sebagai baris backup_logs biasa (triggered_by='pre_restore',
          # lihat migration 20260819000000) supaya muncul di riwayat Admin
          # Panel dan bisa dipakai untuk restore manual kalau dibutuhkan --
          # sama seperti backup manual/terjadwal biasa, cuma sumbernya beda.
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/backup_logs" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"status\":\"success\",\"triggered_by\":\"pre_restore\",\"triggered_by_admin\":$( [ -n "$TRIGGERED_BY_ADMIN" ] && echo "\"$TRIGGERED_BY_ADMIN\"" || echo null ),\"file_name\":\"${FILE_NAME}\",\"file_size_bytes\":${FILE_SIZE},\"storage_path\":\"${STORAGE_PATH}\",\"storage_provider\":\"gdrive\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Backup pengaman berhasil dibuat & diupload, tapi gagal dicatat ke backup_logs (HTTP $HTTP_CODE). File tetap ada di Google Drive: ${STORAGE_PATH}"
          fi

          echo "::notice::Backup pengaman selesai: ${STORAGE_PATH} (${FILE_SIZE} bytes). Kalau restore ini bermasalah, file ini bisa dipakai untuk restore ulang ke kondisi SEBELUM restore ini dijalankan."
          echo "pre_restore_storage_path=${STORAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Download file backup dari Google Drive
        id: dl
        run: |
          set -euo pipefail
          rclone copy "gdrive:${STORAGE_PATH}" . --progress
          FILE_NAME=$(basename "${STORAGE_PATH}")
          if [ ! -f "$FILE_NAME" ]; then
            echo "::error::File $FILE_NAME tidak ditemukan setelah rclone copy"
            exit 1
          fi
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Jalankan restore
        id: restore
        run: |
          set -euo pipefail
          PG_RESTORE=/usr/lib/postgresql/17/bin/pg_restore
          PSQL=/usr/lib/postgresql/17/bin/psql
          DB_URL="${{ secrets.SUPABASE_DB_URL }}"
          FILE_NAME="${{ steps.dl.outputs.file_name }}"

          if [ "$SCOPE" = "full" ]; then
            echo "::notice::Restore FULL -- seluruh tabel di dalam file dump akan ditimpa."
            # PENTING (insiden 14/7/2026): SEBELUMNYA pakai
            # `pg_restore --clean --if-exists` yang mencoba DROP/CREATE
            # schema public + semua fungsi di dalamnya. Ini GAGAL kalau ada
            # objek di schema LAIN (mis. trigger on_auth_user_created di
            # auth.users, dikelola Supabase Auth, di luar dump) yang masih
            # mereferensikan fungsi/schema itu -- pg_restore tidak tahu cara
            # men-drop dependency lintas-schema itu tanpa CASCADE, jadi
            # error "cannot drop function ... because other objects depend
            # on it" / "cannot drop schema public because ...". Menambah
            # CASCADE juga BERBAHAYA (bisa ikut menghapus trigger auth resmi
            # milik Supabase).
            #
            # FIX: JANGAN sentuh schema/fungsi/extension SAMA SEKALI.
            # Restore FULL sekarang pakai teknik yang SAMA PERSIS dengan
            # restore TABLE-SCOPE di bawah (data-only + session_replication_
            # role=replica + single-transaction) -- bedanya cuma daftar
            # tabelnya diambil dari SEMUA "TABLE DATA" yang benar-benar ada
            # di dalam file dump (lewat `pg_restore --list`), bukan
            # daftar tabel pilihan admin. Ini juga otomatis lebih aman kalau
            # dump lebih lama dari migration terbaru (tidak asumsi skema
            # sekarang = skema saat dump diambil).
            mapfile -t TABLES < <(
              "$PG_RESTORE" --list "$FILE_NAME" \
                | grep -E ' TABLE DATA public ' \
                | awk '{print $7}'
            )
            if [ "${#TABLES[@]}" -eq 0 ]; then
              echo "::error::Tidak ada 'TABLE DATA public' ditemukan di file dump -- restore dibatalkan, cek file dump-nya."
              exit 1
            fi
            echo "::notice::Ditemukan ${#TABLES[@]} tabel di dalam dump: ${TABLES[*]}"
          else
            echo "::notice::Restore TABLE-SCOPE -- hanya tabel: $TABLE_NAMES"
            IFS=',' read -ra TABLES <<< "$TABLE_NAMES"
          fi

          # Bangun daftar argumen -t per tabel untuk pg_restore
          TABLE_ARGS=()
          for T in "${TABLES[@]}"; do
            T_TRIMMED=$(echo "$T" | xargs)
            [ -z "$T_TRIMMED" ] && continue
            TABLE_ARGS+=("-t" "$T_TRIMMED")
          done

          echo "::notice::Menjalankan DELETE + restore data dalam SATU transaksi sungguhan..."
          # ═══════════════════════════════════════════════════════════════
          # PERBAIKAN KRUSIAL (insiden kehilangan data total 15/7/2026):
          #
          # Versi SEBELUMNYA menjalankan DELETE per tabel lewat PEMANGGILAN
          # `psql` TERPISAH (satu proses psql = satu koneksi = auto-commit
          # sendiri-sendiri), BARU SETELAH SEMUA tabel kosong, `pg_restore
          # --single-transaction` dijalankan sebagai proses/koneksi LAIN
          # untuk memuat ulang datanya. Dua masalah fatal:
          #
          #   1. PGOPTIONS="-c session_replication_role=replica" yang
          #      dipasang di pg_restore TIDAK PERNAH benar-benar aktif --
          #      itu parameter startup koneksi, dan pooler Supabase
          #      (Supavisor) mengabaikannya secara diam-diam. Akibatnya FK
          #      trigger tetap aktif saat pg_restore meng-COPY data balik,
          #      dan gagal begitu ada tabel anak yang ke-load sebelum tabel
          #      induknya (mis. bill_reminder_notifications sebelum users).
          #
          #   2. KARENA DELETE (banyak koneksi terpisah, auto-commit) dan
          #      INSERT (satu koneksi pg_restore) TIDAK berada dalam
          #      transaksi yang SAMA, begitu pg_restore gagal di tengah
          #      jalan dan --single-transaction meng-ROLLBACK, yang
          #      ROLLBACK cuma bagian INSERT-nya. DELETE yang sudah lebih
          #      dulu ke-commit TIDAK IKUT rollback -> hasilnya SEMUA 28
          #      tabel kosong permanen (data pengguna, transaksi, aktivasi
          #      premium, bill reminder, dst hilang total).
          #
          # FIX: SET session_replication_role, SEMUA DELETE, dan SEMUA
          # INSERT/COPY sekarang dikirim sebagai SATU naskah SQL ke SATU
          # proses `psql` (bukan PGOPTIONS di pg_restore), dibungkus
          # `--single-transaction` MILIK PSQL (bukan milik pg_restore).
          # `SET session_replication_role` di sini adalah PERINTAH SQL
          # biasa yang dieksekusi DALAM sesi yang sudah terbentuk -- bukan
          # startup parameter -- jadi pasti diteruskan oleh pooler,
          # terbukti dari step DELETE versi lama yang justru berhasil
          # dengan pola persis ini.
          #
          # Dengan `psql -v ON_ERROR_STOP=1 --single-transaction`: KALAU
          # ADA satu saja statement yang gagal (termasuk FK violation),
          # SELURUH transaksi (DELETE + INSERT sekaligus) di-ROLLBACK --
          # artinya data ASLI (sebelum restore) tetap utuh tidak
          # tersentuh sama sekali kalau restore gagal. Ini baru benar-benar
          # atomik (all-or-nothing).
          #
          # `pg_restore --data-only -f -` (bukan --dbname) membuat pg_restore
          # menulis SQL teks biasa ke stdout, TIDAK terhubung ke database
          # sama sekali -- semua koneksi & transaksi sepenuhnya dikendalikan
          # oleh psql di ujung pipe ini.
          {
            echo "SET session_replication_role = 'replica';"
            for T in "${TABLES[@]}"; do
              T_TRIMMED=$(echo "$T" | xargs)
              [ -z "$T_TRIMMED" ] && continue
              echo "DELETE FROM public.${T_TRIMMED};"
            done
            "$PG_RESTORE" --no-owner --no-privileges --data-only \
              "${TABLE_ARGS[@]}" -f - "$FILE_NAME"
          } | "$PSQL" "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q

      - name: Catat status sukses & matikan maintenance mode
        if: success()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/backup_restore_logs?id=eq.${RESTORE_LOG_ID}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"success\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          # Service role bypass RLS -> update langsung ke maintenance_settings,
          # tidak lewat RPC admin_set_maintenance_mode (RPC itu butuh auth.uid()
          # dari sesi user, tidak tersedia untuk service role).
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/maintenance_settings?id=eq.1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"is_active\":false}"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            -d text="✅ Restore database sukses (scope: ${SCOPE}). Maintenance mode dimatikan otomatis. Backup pengaman (kondisi SEBELUM restore ini) tersimpan di: ${{ steps.prebackup.outputs.pre_restore_storage_path }}"

      - name: Catat status gagal (tetap matikan maintenance mode)
        if: failure()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/backup_restore_logs?id=eq.${RESTORE_LOG_ID}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"error_message\":\"Lihat log GitHub Actions run ${{ github.run_id }}\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          # Tetap matikan maintenance mode supaya app tidak terkunci selamanya.
          # CATATAN (update pasca-fix atomicity 15/7/2026): restore sekarang
          # DIJAMIN atomik -- DELETE dan INSERT berada dalam SATU transaksi
          # psql --single-transaction (lihat step "Jalankan restore"). Kalau
          # step ini gagal, transaksi itu ROLLBACK SELURUHNYA, jadi data yang
          # ada di database SEBELUM restore ini dijalankan TIDAK IKUT
          # terhapus/berubah. Beda dengan insiden 15/7/2026 (versi lama yang
          # DELETE-nya tidak atomik dengan INSERT). Notifikasi di bawah tetap
          # menyertakan path backup pengaman sebagai referensi tambahan,
          # bukan karena data live diasumsikan rusak.
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/maintenance_settings?id=eq.1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"is_active\":false}"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            -d text="🚨 RESTORE GAGAL (scope: ${SCOPE}). Cek GitHub Actions run ${{ github.run_id }} untuk detail error. Restore ini atomik -- data SEBELUM restore seharusnya tidak ikut berubah (rollback penuh). Backup pengaman (kondisi tepat sebelum restore ini) tetap tersimpan di: ${{ steps.prebackup.outputs.pre_restore_storage_path }} kalau dibutuhkan untuk verifikasi/pemulihan manual."
