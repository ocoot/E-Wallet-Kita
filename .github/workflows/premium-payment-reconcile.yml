name: Premium Payment Reconciliation

# Jaring pengaman untuk webhook KlikQRIS (api/premium/payment.ts, PUT).
# Webhook itu SENGAJA selalu balas 200 ke KlikQRIS walau ada error internal
# (supaya KlikQRIS tidak infinite-retry endpoint yang error terus) --
# konsekuensinya, kalau proses di dalam webhook gagal di tengah jalan
# (network blip ke Supabase, dsb), TIDAK ADA retry otomatis dari provider.
#
# Workflow ini memanggil endpoint yang sama secara berkala. Endpoint
# mendeteksi bahwa ini panggilan reconciliation (bukan webhook asli maupun
# request user biasa) dari header Authorization yang cocok dengan
# CRON_SECRET, lalu mencari transaksi PENDING yang sudah lama, cek ulang
# status ASLI ke API KlikQRIS, dan selesaikan lewat RPC atomic
# `process_klikqris_webhook` yang sama dipakai webhook (lihat migration
# 20260823000000_atomic_klikqris_webhook.sql).
#
# KENAPA GitHub Actions, bukan Vercel Cron:
#   Vercel Hobby plan cuma bisa 1x/hari untuk cron native, dan waktunya
#   tidak presisi (bisa meleset sampai ±1 jam). GitHub Actions gratis untuk
#   repo ini (sudah dipakai untuk db-backup.yml dkk), minimum interval
#   5 menit, jadi dipakai interval 15 menit di bawah supaya transaksi yang
#   "macet" tidak lama-lama nyangkut PENDING.
#
# CATATAN keterbatasan GitHub Actions schedule (baca sebelum mengandalkan ini
# untuk sesuatu yang time-critical):
#   - Waktu run TIDAK presisi -- delay 5-30 menit umum terjadi saat traffic
#     GitHub Actions sedang tinggi, kadang lebih.
#   - Scheduled workflow otomatis DINONAKTIFKAN kalau repo tidak ada
#     aktivitas (commit/PR/dst) selama 60 hari. Repo ini aktif dikembangkan
#     jadi kemungkinan kecil kena, tapi kalau project sempat "istirahat"
#     lama, cek tab Actions dan klik "Enable workflow" lagi.
#   - GitHub tidak mengirim notifikasi otomatis kalau scheduled run GAGAL
#     (beda dengan gagal-total workflow lain yang biasanya kelihatan di
#     tab Actions). Makanya step terakhir di bawah sengaja `exit 1` kalau
#     HTTP status bukan 200, supaya minimal muncul sebagai run merah.
#
# Secret yang WAJIB diset di Settings -> Secrets and variables -> Actions:
#   APP_URL       sudah ada (dipakai notify-update.yml) -- contoh:
#                 https://nama-app-kamu.vercel.app
#   CRON_SECRET   string acak bebas, HARUS SAMA PERSIS dengan env var
#                 CRON_SECRET di Vercel project settings (yang dibaca
#                 handler() di api/premium/payment.ts untuk mengenali
#                 panggilan reconciliation).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Panggil endpoint reconciliation
        run: |
          set -e
          HTTP_CODE=$(curl -s -o /tmp/reconcile_response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/premium/payment" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $HTTP_CODE — response:"
          cat /tmp/reconcile_response.json
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Reconciliation gagal dipanggil (HTTP $HTTP_CODE)."
            exit 1
          fi
