name: Notify Users on Update

# PENTING -- urutan eksekusi:
# Workflow ini SENGAJA tidak lagi jalan langsung dari `push: branches: [main]`.
# Sebelumnya, workflow ini dan `generate-changelog.yml` sama-sama trigger dari
# event push yang SAMA, dan jalan PARALEL. Karena notify-update.yml jauh lebih
# cepat (cuma polling status deploy Vercel) dibanding generate-changelog.yml
# (npm ci + panggil Gemini + tulis ke Supabase), notifikasi "update
# tersedia" HAMPIR SELALU terkirim ke user SEBELUM entri changelog untuk
# commit itu sempat ditulis -- akibatnya popup update yang dilihat user
# menampilkan changelog dari rilis SEBELUMNYA, selalu telat satu versi.
#
# Fix: workflow ini sekarang trigger via `workflow_run`, menunggu
# `generate-changelog.yml` BENAR-BENAR selesai (baik itu berhasil menulis
# entri baru ke Supabase, atau memutuskan tidak ada yang perlu ditulis)
# sebelum mulai.
#
# CATATAN (2026-08-15): sejak `generate-changelog.yml` berhenti commit balik
# ke `main` (changelog sekarang disimpan di tabel Supabase, bukan file git
# -- lihat migration 20260815000000_changelog_entries.sql), tidak ada lagi
# "commit susulan" yang perlu ditunggu di sini. Checkout HEAD terbaru di
# bawah tetap dipertahankan sekadar untuk mengambil SHA commit developer
# yang sebenarnya (untuk polling status deploy Vercel-nya), bukan lagi
# untuk mengejar commit bot.
on:
  workflow_run:
    workflows: ["Generate Changelog (AI)"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    # `generate-changelog.yml` yang gagal total (mis. checkout/npm ci error)
    # bukan alasan buat batal notifikasi -- deployment kode aslinya tetap
    # independen dan tetap layak diberitahukan. Hanya 'cancelled' yang
    # dilewati (biasanya berarti run itu sendiri sengaja dibatalkan).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      # ── 0. Tentukan apakah notifikasi harus dilewati ────────────────────────
      # Dicek dari pesan commit yang MEMICU generate-changelog.yml. Sejak
      # bot changelog tidak lagi membuat commit balik (lihat catatan di atas
      # file ini), penanda "[skip-notify]" sekarang murni opt-out MANUAL:
      # developer bisa sengaja menambahkan "[skip-notify]" di pesan commit
      # sendiri (mis. untuk perubahan backend-only yang tidak ingin memicu
      # popup "update tersedia" ke user) dan notifikasi akan dilewati.
      - name: Cek penanda skip-notify dari commit pemicu
        id: skip
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Commit pemicu generate-changelog.yml:"
            echo "$TRIGGER_MSG"
            if [[ "$TRIGGER_MSG" == *"[skip-notify]"* ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Mengandung [skip-notify] -- notifikasi dilewati."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ── 1. Ambil SHA HEAD main ───────────────────────────────────────────
      - name: Checkout main (HEAD terbaru)
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ambil SHA HEAD
        id: head
        if: steps.skip.outputs.skip != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ── 2. Tunggu sampai deployment Vercel untuk HEAD main READY ───────────
      # Vercel deploy production terjadi otomatis lewat Git integration
      # (bukan lewat GitHub Actions ini), jadi di sini kita cuma POLLING
      # status deployment lewat Vercel API sampai statenya READY, lalu baru
      # kirim notifikasi. Kalau build GAGAL atau timeout, job berhenti di
      # step ini dan notifikasi TIDAK dikirim — supaya user tidak disuruh
      # "update" ke versi yang sebenarnya belum ter-deploy.
      - name: Wait for Vercel deployment to be ready
        id: wait
        if: steps.skip.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          COMMIT_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -e
          MAX_ATTEMPTS=40       # 40 x 15 detik = maksimal 10 menit menunggu
          SLEEP_SECONDS=15
          TEAM_QS=""
          if [ -n "$VERCEL_TEAM_ID" ]; then TEAM_QS="&teamId=$VERCEL_TEAM_ID"; fi

          for i in $(seq 1 $MAX_ATTEMPTS); do
            RESPONSE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=15$TEAM_QS")

            STATE=$(node -e "
              const data = JSON.parse(process.argv[1]);
              const sha = process.argv[2];
              const dep = (data.deployments || []).find(d => d.meta && d.meta.githubCommitSha === sha);
              console.log(dep ? dep.state : 'NOT_FOUND');
            " "$RESPONSE" "$COMMIT_SHA")

            echo "Percobaan $i/$MAX_ATTEMPTS — status deployment: $STATE"

            if [ "$STATE" = "READY" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "::error::Deployment gagal (status: $STATE) — notifikasi update TIDAK dikirim."
              exit 1
            fi

            sleep $SLEEP_SECONDS
          done

          echo "::error::Timeout menunggu deployment READY — notifikasi update TIDAK dikirim."
          exit 1

      # ── 2. Kirim push notification "update tersedia" ke semua user ─────────
      - name: Send update push notification
        if: steps.skip.outputs.skip != 'true' && steps.wait.outputs.ready == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          UPDATE_NOTIFY_SECRET: ${{ secrets.UPDATE_NOTIFY_SECRET }}
        run: |
          set -e
          HTTP_CODE=$(curl -s -o /tmp/broadcast_response.json -w "%{http_code}" \
            -X POST "$APP_URL/api/admin/broadcast" \
            -H "Content-Type: application/json" \
            -H "x-update-secret: $UPDATE_NOTIFY_SECRET" \
            -d '{"channel":"push"}')

          echo "HTTP $HTTP_CODE — response:"
          cat /tmp/broadcast_response.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Notifikasi update berhasil dikirim."
          else
            echo "::error::❌ Gagal mengirim notifikasi update (HTTP $HTTP_CODE)."
            exit 1
          fi
